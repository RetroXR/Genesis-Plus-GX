# Build the retroXR Genesis Plus GX core for Windows, Android, Linux and macOS
# and publish it as a release, so retroXR's CoreDownloadManager can fetch it.
#
# This fork carries the Game Gear's Gear-to-Gear cable: the EXT port
# (libretro/gg_link.c) joins a link bus the frontend hosts through
# RETRO_ENVIRONMENT_GET_LINK_INTERFACE (libretro/RetroArch#19454) and speaks
# `gg-ext-1`. With no bus, or nothing cabled, the port behaves exactly as the
# stock core's does, so there is no option to switch it on.
#
# It also carries the state rollback netplay needs: tagged savestate blocks for
# the 68000's refresh schedule and prefetch, the YM2612 BUSY deadline, the pad
# protocol latches and the Master System PAUSE edge, each of which a reload left
# at its reset value. Older states still load.
#
#   Windows  genesis_plus_gx_libretro.dll.zip          containing genesis_plus_gx_libretro.dll
#   Android  genesis_plus_gx_libretro_android.so.zip   containing genesis_plus_gx_libretro_android.so
#   Linux    genesis_plus_gx_libretro.so.zip           containing genesis_plus_gx_libretro.so
#   macOS    genesis_plus_gx_libretro_arm64.dylib.zip
#            genesis_plus_gx_libretro_x86_64.dylib.zip
#              each containing genesis_plus_gx_libretro.dylib
#
# The release must NOT be a prerelease: the download URL is the /releases/latest/
# form, and GitHub's `latest` skips prereleases.

name: retroXR core release

on:
  push:
    tags:
      - 'retroxr-genesis_plus_gx-libretro-v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or SHA to build'
        required: true
        default: 'retroxr'
      tag:
        description: 'Release tag to publish as (leave blank to build without publishing)'
        required: false
        default: ''

jobs:
  windows:
    name: Windows x86_64 (mingw-w64)
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-x86-64 make zip

      - uses: actions/checkout@v6
        with:
          submodules: recursive
          ref: ${{ github.event.inputs.ref || github.ref }}

      # platform=win is passed explicitly and never inferred. The makefile picks
      # its platform from uname, so building for Windows from a Linux host would
      # otherwise silently produce a unix target.
      - name: Build
        run: |
          make -f Makefile.libretro platform=win \
            CC=x86_64-w64-mingw32-gcc CXX=x86_64-w64-mingw32-g++ \
            -j$(nproc)

      # maxdepth 1: upstream commits a prebuilt copy under builds/, which is not
      # this build and must never be what ships.
      - name: Package
        run: |
          mapfile -t hits < <(find . -maxdepth 1 -name 'genesis_plus_gx_libretro.dll' -type f)
          if [ "${#hits[@]}" -ne 1 ]; then
            echo "expected exactly one genesis_plus_gx_libretro.dll, found ${#hits[@]}:"
            printf '  %s\n' "${hits[@]}"
            exit 1
          fi
          mkdir -p stage
          cp "${hits[0]}" stage/genesis_plus_gx_libretro.dll
          (cd stage && zip -q -X ../genesis_plus_gx_libretro.dll.zip genesis_plus_gx_libretro.dll)
          file stage/genesis_plus_gx_libretro.dll
          ls -lh genesis_plus_gx_libretro.dll.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: genesis_plus_gx_libretro.dll.zip
          if-no-files-found: error

  android:
    name: Android arm64-v8a
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip zip
          # Into RUNNER_TEMP, NOT the workspace. This step runs before
          # actions/checkout, and checkout clears the workspace it checks into --
          # so an NDK unpacked at $PWD here exists at the end of this step and is
          # gone by the time the build runs. The failure is a bare
          # "ndk-build: command not found", which says nothing about why.
          wget -q -O "$RUNNER_TEMP/ndk.zip" https://dl.google.com/android/repository/android-ndk-r27d-linux.zip
          unzip -q "$RUNNER_TEMP/ndk.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/android-ndk-r27d" >> $GITHUB_PATH

      - uses: actions/checkout@v6
        with:
          submodules: recursive
          ref: ${{ github.event.inputs.ref || github.ref }}

      # Application.mk says APP_ABI := all; arm64-v8a is passed on the command
      # line so the run builds the one ABI retroXR ships and not every ABI the
      # NDK knows.
      - name: Build
        run: |
          cd libretro/jni
          ndk-build APP_ABI=arm64-v8a -j$(nproc)

      # LOCAL_MODULE is `retro`, so ndk-build emits libretro.so -- a name that
      # says nothing about which core it is. It is renamed on the way into the
      # zip to the name the asset advertises and the installer expects.
      - name: Package
        run: |
          # libs/, not obj/. ndk-build leaves an unstripped copy in
          # obj/local/<abi>/ and INSTALLS the deliverable to libs/<abi>/, so a
          # search for the bare name finds two and the bigger one is the wrong
          # one. The exactly-one check below is what turned that into a failed
          # run rather than a core shipped with its debug info attached.
          mapfile -t hits < <(find . -path '*/libs/arm64-v8a/*' -name 'libretro.so' -type f)
          if [ "${#hits[@]}" -ne 1 ]; then
            echo "expected exactly one arm64-v8a libretro.so, found ${#hits[@]}:"
            printf '  %s\n' "${hits[@]}"
            exit 1
          fi
          mkdir -p stage
          cp "${hits[0]}" stage/genesis_plus_gx_libretro_android.so
          (cd stage && zip -q -X ../genesis_plus_gx_libretro_android.so.zip genesis_plus_gx_libretro_android.so)
          file stage/genesis_plus_gx_libretro_android.so
          ls -lh genesis_plus_gx_libretro_android.so.zip

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: genesis_plus_gx_libretro_android.so.zip
          if-no-files-found: error

  # The oldest Ubuntu runner: a shared library loads only against a glibc at
  # least as new as the one it was linked with.
  linux:
    name: Linux x86_64
    runs-on: ubuntu-22.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make zip

      - uses: actions/checkout@v6
        with:
          submodules: recursive
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Build
        run: |
          make -f Makefile.libretro platform=unix -j$(nproc)

      - name: Package
        run: |
          mapfile -t hits < <(find . -maxdepth 1 -name 'genesis_plus_gx_libretro.so' -type f)
          if [ "${#hits[@]}" -ne 1 ]; then
            echo "expected exactly one genesis_plus_gx_libretro.so, found ${#hits[@]}:"
            printf '  %s\n' "${hits[@]}"
            exit 1
          fi
          mkdir -p stage
          cp "${hits[0]}" stage/genesis_plus_gx_libretro.so
          (cd stage && zip -q -X ../genesis_plus_gx_libretro.so.zip genesis_plus_gx_libretro.so)
          file stage/genesis_plus_gx_libretro.so
          ls -lh genesis_plus_gx_libretro.so.zip

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: genesis_plus_gx_libretro.so.zip
          if-no-files-found: error

  # Both architectures on one Apple Silicon runner, with the flags libretro's
  # own osx-arm64 CI template passes: the osx branch of the makefile only
  # applies a target triple and SDK when CROSS_COMPILE=1.
  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: macos-14
    strategy:
      matrix:
        include:
          - arch: arm64
            triple: arm64-apple-macos10.15
          - arch: x86_64
            triple: x86_64-apple-macos10.13
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Build
        run: |
          make -f Makefile.libretro platform=osx CC=clang CXX=clang++ CROSS_COMPILE=1 \
            LIBRETRO_APPLE_PLATFORM=${{ matrix.triple }} \
            LIBRETRO_APPLE_ISYSROOT="$(xcrun --sdk macosx --show-sdk-path)" \
            -j$(sysctl -n hw.ncpu)

      - name: Package
        run: |
          lib=genesis_plus_gx_libretro.dylib
          # No mapfile: macOS still ships bash 3.2, where it does not exist, and
          # the step dies with exit 127 before it has looked at a thing.
          hits=()
          while IFS= read -r f; do hits+=("$f"); done < <(find . -maxdepth 1 -name "$lib" -type f)
          if [ "${#hits[@]}" -ne 1 ]; then
            echo "expected exactly one $lib, found ${#hits[@]}:"
            printf '  %s\n' "${hits[@]}"
            exit 1
          fi
          lipo -info "${hits[0]}"
          if [ "$(lipo -archs "${hits[0]}")" != "${{ matrix.arch }}" ]; then
            echo "$lib is not ${{ matrix.arch }}"
            exit 1
          fi
          mkdir -p stage
          cp "${hits[0]}" "stage/$lib"
          (cd stage && zip -q -X ../genesis_plus_gx_libretro_${{ matrix.arch }}.dylib.zip "$lib")
          ls -lh genesis_plus_gx_libretro_${{ matrix.arch }}.dylib.zip

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: genesis_plus_gx_libretro_${{ matrix.arch }}.dylib.zip
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [windows, android, linux, macos]
    if: github.event_name == 'push' || github.event.inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          ls -lh dist
          cat > notes.md <<EOF
          Genesis Plus GX libretro core built for retroXR, from \`$GITHUB_SHA\`.

          Windows x86_64, Android arm64-v8a, Linux x86_64 and macOS arm64 and
          x86_64. The source for these binaries is this tag.

          Over the stock buildbot build this carries the Game Gear's Gear-to-Gear
          cable, spoken as \`gg-ext-1\` over a link bus the frontend hosts, and
          the state rollback netplay needs: savestates now carry the 68000's
          refresh schedule and prefetch, the YM2612 BUSY deadline, the pad
          protocol latches and the Master System PAUSE edge, so a reloaded
          machine runs on the same timeline as one that never stopped. The
          blocks are tagged, so older states still load.
          EOF
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Genesis Plus GX (retroXR build) $TAG" \
              --notes-file notes.md
          fi
          gh release upload "$TAG" \
            dist/genesis_plus_gx_libretro.dll.zip \
            dist/genesis_plus_gx_libretro_android.so.zip \
            dist/genesis_plus_gx_libretro.so.zip \
            dist/genesis_plus_gx_libretro_arm64.dylib.zip \
            dist/genesis_plus_gx_libretro_x86_64.dylib.zip \
            --repo "$GITHUB_REPOSITORY" --clobber
